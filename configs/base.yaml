# ===========================================================================
#  FieldMind Boiler Agent -- base configuration
# ===========================================================================
#  Every decision variable from Plan §11.2 is here and nowhere else. The
#  sweep (bench/sweep.py) works by overriding keys in this file, so anything
#  hard-coded elsewhere is a bug that will silently limit the search space.
# ===========================================================================

# ---------------------------------------------------------------------------
#  THE MODEL SWITCH.  This is the only line you change to move between
#  cloud development and on-device measurement.
#
#     mock    no network, no key, deterministic. Plumbing tests only --
#             never report a mock run as an agent result.
#     gemini  Google AI Studio. Valid for QUALITY metrics (Q1-Q7) while the
#             device path is being built. Meaningless for SYSTEM metrics.
#     litert  LiteRT-LM on the QIDK. The numbers that go in the writeup.
# ---------------------------------------------------------------------------
llm:
  backend: mock

  gemini:
    model: gemini-2.0-flash
    api_key_env: GOOGLE_API_KEY     # export it; never put the key in this file
    temperature: 0.1
    timeout_s: 30
    json_mode: true                 # cloud stand-in for grammar-constrained decoding

  litert:
    mode: adb                       # adb (host drives board) | local (agent on board)
    device_dir: /data/local/tmp/llm
    binary: litert_lm_main
    model_file: Gemma3-1B-IT_q4_ekv1280_sm8650.litertlm
    accelerator: npu                # cpu | gpu | npu   <- decision variable b_s
    timeout_s: 60
    adb_serial: ""                  # set if more than one device is attached

# ---------------------------------------------------------------------------
#  Agent behaviour
# ---------------------------------------------------------------------------
agent:
  tick_period_s: 30                 # decision variable T: {15, 30, 60}
  policy: sequential                # decision variable pi: sequential|pipelined|conditional
  verifier: conditional             # decision variable v: always|conditional|never
  verifier_band: [0.35, 0.75]       # conditional mode fires inside this band
  max_tokens: 384
  max_actions: 3
  min_faithfulness: 0.5             # below this the model's ranking is discarded
  hard_stage_deadline_ms: 200       # constraint C1 -- miss rate must be zero
  llm_budget_ms: 8000

  triage:
    trip_horizon_min: 5.0

  retrieval:                        # decision variable k
    k_cases: 4
    k_notes: 5
    k_experience: 2
    k_records: 5
    topology_depth: 3
    context_cap_tokens:             # decision variable L, per triage level
      WATCH: 2048
      INVESTIGATE: 3072
      URGENT: 1024

# ---------------------------------------------------------------------------
#  Deterministic check thresholds  (Plan Appendix A.5)
#  RE-TUNED IN STAGE 4 against the regenerated episodes: sub-model-4 dropped
#  bed/ms emit noise ~20x but added an OU load driver + independent per-
#  subsystem process disturbances, so the no-fault slope/residual
#  distributions moved. Every threshold below is now set from the p99.7 of the
#  matching statistic over 12 FRESH-seeded no-fault runs (seeds 900-911, kept
#  disjoint from N01-N06 so Q5 stays uncircular). Aggregate analytic FP rate
#  1.5 ticks/hour (report: reports/stage4_regeneration.md).
# ---------------------------------------------------------------------------
checks:
  sample_period_s: 5.0
  # How much bed temperature moves per TPH of load; the load component
  # _load_normalised_bed_slope removes before flagging a drift.
  # Stage-4 refit over the regenerated N01-N06: OLS slope(bed)~slope(steam)
  # gives 2.21 (R2 0.61), but errors-in-variables attenuation biases that low;
  # the value that MINIMISES the no-fault load-normalised bed-slope residual is
  # 2.75-2.85, matching the simulator generator gain K_BED_LOAD = 2.75. Kept at
  # 2.75. Also the LOAD_COEF stamped into every ground_truth.json (DEVIATION
  # band); state_timeline_load_coef records it so a future refit is visible.
  load_coef_degc_per_tph: 2.75

  limits:
    bed_temp_avg:
      alarm_hi:    {op: ">", value: 880.0, severity: ALARM}
      critical_hi: {op: ">", value: 940.0, severity: CRITICAL}
    drum_level:
      alarm_lo:    {op: "<", value: 20.0, severity: ALARM}
      critical_lo: {op: "<", value: 10.0, severity: CRITICAL}
    ms_temperature:
      alarm_hi:    {op: ">", value: 550.0, severity: ALARM}
    drum_pressure:
      alarm_hi:    {op: ">", value: 70.0, severity: ALARM}
      alarm_lo:    {op: "<", value: 55.0, severity: ALARM}

  rates:
    # drum_level: no-fault 3-min slope p99.7 = 0.13 %/min -> 0.5 unchanged.
    # bed_temp_avg: NOT load-normalised, so the OU load swings it; no-fault
    #   10-min slope p99.7 = 1.28 degC/min (was calibrated against 20x-larger
    #   emit noise at 0.4). drum_pressure: no-fault 5-min slope p99.7 = 0.12.
    drum_level:    {threshold: 0.5,  sustained_min: 3.0,  direction: abs, unit: "%/min",       severity: WATCH}
    bed_temp_avg:  {threshold: 1.6,  sustained_min: 10.0, direction: up,  unit: "degC/min",    severity: WATCH}
    drum_pressure: {threshold: -0.15, sustained_min: 5.0, direction: down, unit: "kg/cm2/min", severity: WATCH}

  # Long-horizon drift. The ONLY thing that catches family E.
  # STAGE-4 FINDING (reports/stage4_regeneration.md): with the OU load driver +
  # per-subsystem process disturbances, the no-fault load-normalised bed slope
  # over 55 min has p99.7 ~ 0.24 degC/min, and family E's own signal is
  # ~0.15-0.24 degC/min -- the two distributions OVERLAP. There is no threshold
  # that catches family E without ~1 FP/hour on this one check. 0.22 is the
  # compromise (aggregate stays < 2/h); family E detection is now marginal, a
  # recorded disagreement for the advisor / an L1 cumulative-offset detector.
  # Window widened 40 -> 55 min (the longest that fits the 60-min buffer) to
  # tighten the no-fault spread as far as it will go.
  rates_long:
    bed_temp_avg:   {threshold: 0.22,  sustained_min: 55.0, direction: up,   unit: "degC/min", severity: WATCH}
    ms_temperature: {threshold: 0.20,  sustained_min: 40.0, direction: up,   unit: "degC/min", severity: INFO}
    drum_pressure:  {threshold: -0.01, sustained_min: 40.0, direction: down, unit: "kg/cm2/min", severity: INFO}

  balance:
    # level_gain: was 0.22 (an invented literal, DERIVATIONS 3.1); now matches
    #   the simulator's geometry.K_level(66 kg/cm2(g)) so the L1 water balance
    #   inverts exactly the relation the sim integrates.
    # residual_tph: no-fault 5-min residual p99.7 = 0.13 t/h; family B leak
    #   residual is ~2-3 t/h, so 1.5 separates them with margin.
    # p_falling: no-fault 5-min pressure slope p99.7 = 0.12 kg/cm2/min.
    # bed_rising: no-fault 5-min load-normalised bed slope p99.7 = 1.19.
    level_gain_pct_per_min_per_tph: 0.586
    residual_tph: 1.5
    window_min: 5.0
    p_falling: 0.15
    bed_rising: 1.3
    steam_flat_tph_per_min: 0.3

  validity:
    stuck_minutes: 10.0
    stuck_mad_eps: 0.001
    physical_range:
      drum_level:      [0.0, 100.0]
      feed_water_flow: [0.0, 120.0]
      steam_flow:      [0.0, 120.0]
      drum_pressure:   [0.0, 90.0]
      bed_temp_avg:    [0.0, 1200.0]
      ms_temperature:  [0.0, 700.0]
    max_step:
      drum_level: 5.0
      feed_water_flow: 15.0
      steam_flow: 15.0
      drum_pressure: 3.0
      bed_temp_avg: 25.0
      ms_temperature: 25.0

# ---------------------------------------------------------------------------
paths:
  asset_model: data/kb/asset_model.json
  case_library: data/kb/case_library.json
  action_catalogue: data/kb/action_catalogue.json
  episodes: data/episodes
  experience: data/experience/store.json
  results: results
