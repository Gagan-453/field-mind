# bev-decider on multi_v3 (reports/bev_decider.md, branch bev-decider-3).
# An OVERLAY on configs/base.yaml (run_demo.py / scripts/benchmark.sh take one
# overlay): EXACTLY configs/v3.yaml (merge_rule hybrid, raw notes, no group
# letters, Gemma 1B on the CPU lane) plus the decider and its lane.
# tests/test_decider.py holds it to that, so arm A (v3.yaml) and arm B (this
# file) differ by the decider only.
#   decider under hybrid: its checked pick is a capped offset (+0.35 / +0.175,
#   summed with the diagnosticians' and capped at 1.2 per case per episode),
#   never pushed to a flat case. hybrid's regime is read from belief alone, and
#   on weak / tied ticks the model's picks still lead; the decider moves only
#   the offset order (clear ticks, and the cases after the model's picks).
agent: {verifier: conditional}
multi:
  placement: fixed
  fixed_placement: {diagnostician: npu, diag_water: npu, diag_heat: npu, verifier: cpu,
    text_reader: cpu, query: cpu, decider: bev}
  lanes:
    npu: {model_file: Llama-3.2-3B-Instruct-Q4_0-pure-embq8.gguf}
    cpu: {model_file: gemma-3-1b-it-qat-Q4_0-pure-embq8.gguf}
    # bev-decide (device/bev_decide/), port 8082. Rates: ASSUMED, as in
    # configs/bev.yaml (the NPU lane's cited planning rates; the simulated
    # clock only, never a placement).
    bev: {kind: decider, url: "http://localhost:8082", prefill_tok_s: 909, decode_tok_s: 13.9,
          model_file: bev-decider-0.4B-backbone-Q8_0.gguf}
  compact: {schema: true, rules: true, cases: true, notes: true, world: true, ver_schema: true,
    ver_rules: true, ver_claims: true, group_letters: false, text_reader: false, note_source: raw}
  split: true
  split_on_change: true
  grammar: true
  merge_rule: hybrid
  decider:
    enabled: true
