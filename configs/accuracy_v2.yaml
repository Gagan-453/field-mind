# Second candidate for the accuracy-fix board run (reports/multi_accuracy_fix.md).
# An overlay applied AFTER configs/accuracy.yaml:
#   scripts/benchmark.sh <name> <episodes...> --overlay configs/accuracy_v2.yaml
# accuracy_v2 repeats every key of accuracy.yaml it relies on, so it can be
# used alone. Differences from accuracy.yaml (each changes what the model is
# asked, so only a board run can show its effect):
#   compact.answer: lean          steps 2+3: answer {"r": ...} only; no group letter
#                                 leading the pick, no unchecked `x` / `n`; no worked example
#   compact.case_slots: belief    step 6: at most one case with no moving signature,
#                                 belief's top 2 cases always shown
#   compact.text_reader: false    decision 3: no model note reader; raw notes in the
#   compact.notes: false          data fence, chosen as the single agent chooses them
agent:
  verifier: never
multi:
  placement: fixed
  fixed_placement:
    diagnostician: npu
    diag_water: npu
    diag_heat: npu
    verifier: cpu
    text_reader: cpu
    query: cpu
  lanes:
    npu: {model_file: Llama-3.2-3B-Instruct-Q4_0-pure-embq8.gguf}
    cpu: {model_file: Llama-3.2-3B-Instruct-Q4_0-pure-embq8.gguf}
  compact:
    schema: true
    rules: true
    cases: true
    notes: false
    world: true
    ver_schema: true
    ver_rules: true
    ver_claims: true
    text_reader: false
    answer: lean
    case_slots: belief
  split: true
  split_on_change: true
  grammar: true
  merge_rule: guarded
