# bev ideas (reports/bev_ideas.md): configs/v3.yaml + the bev lane + its
# placement key, every bev idea switch OFF (as base.yaml). Turn ideas on per run:
#   scripts/benchmark.sh <name> <episodes> --overlay configs/bev_ideas.yaml \
#       --bev "explain=on,actions=shadow"
# The decider stays off here (it is configs/bev3.yaml's arm).
agent: {verifier: conditional}
multi:
  placement: fixed
  fixed_placement: {diagnostician: npu, diag_water: npu, diag_heat: npu, verifier: cpu,
    text_reader: cpu, query: cpu, decider: bev, bev: bev}
  lanes:
    npu: {model_file: Llama-3.2-3B-Instruct-Q4_0-pure-embq8.gguf}
    cpu: {model_file: gemma-3-1b-it-qat-Q4_0-pure-embq8.gguf}
    # bev-decide, port 8082. Rates ASSUMED as in configs/bev3.yaml (simulated clock only).
    bev: {kind: decider, url: "http://localhost:8082", prefill_tok_s: 909, decode_tok_s: 13.9,
          model_file: bev-decider-0.4B-backbone-Q8_0.gguf}
  compact: {schema: true, rules: true, cases: true, notes: true, world: true, ver_schema: true,
    ver_rules: true, ver_claims: true, group_letters: false, text_reader: false, note_source: raw}
  split: true
  split_on_change: true
  grammar: true
  merge_rule: hybrid
