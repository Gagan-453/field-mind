# bev-decider runs (reports/bev_decider.md; HUMAN SIGN-OFF 2026-10-07).
# An OVERLAY on configs/base.yaml (run_demo.py takes one overlay): EXACTLY
# configs/accuracy.yaml, with merge_rule nudge, plus the decider and its lane.
# tests/test_bev_config.py holds it to that, so arm A (accuracy.yaml +
# --merge-rule nudge) and arm B (this file) differ by the decider only.
agent:
  verifier: conditional
multi:
  placement: fixed
  fixed_placement:
    diagnostician: npu
    diag_water: npu
    diag_heat: npu
    verifier: cpu
    text_reader: cpu
    query: cpu
    decider: bev                    # the decider runs only on a decider lane
  lanes:
    npu: {model_file: Llama-3.2-3B-Instruct-Q4_0-pure-embq8.gguf}
    cpu: {model_file: Llama-3.2-3B-Instruct-Q4_0-pure-embq8.gguf}
    # bev-decide (device/bev_decide/), port 8082 forwarded like 8080/8081.
    # Rates: ASSUMED = the NPU lane's cited planning rates (plan p.14-15,
    # Llama 3.2 3B Q4_0). Range: prefill at least this (bev-decider's
    # transformer is 0.31B of matrices against 3B, same NPU), upper bound
    # unknown until Part C step 5 measures it (then replace). decode_tok_s is
    # never used (the decider decodes nothing: max_answer_tokens 0) but a lane
    # must have one. Affects: the simulated clock only (queue wait, sim finish);
    # never a placement, since the decider has exactly one eligible lane.
    bev: {kind: decider, url: "http://localhost:8082", prefill_tok_s: 909, decode_tok_s: 13.9,
          model_file: bev-decider-0.4B-backbone-Q8_0.gguf}
  compact:
    schema: true
    rules: true
    cases: true
    notes: true
    world: true
    ver_schema: true
    ver_rules: true
    ver_claims: true
  split: true
  split_on_change: true
  merge_rule: nudge                 # the decider enters through nudge only
  grammar: true
  decider:
    enabled: true
